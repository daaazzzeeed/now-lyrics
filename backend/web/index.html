<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lyrics</title>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body class="boot">
  <div class="bg on" id="bgA"></div>
  <div class="bg" id="bgB"></div>

  <main id="stage">
    <section id="now">
      <div class="cover" id="cover">
        <img id="coverA" alt="">
        <img id="coverB" alt="">
        <span class="cover-note">♪</span>
      </div>
      <div class="meta">
        <div class="title" id="title"></div>
        <div class="artist" id="artist"></div>
        <div class="progress">
          <div class="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
          <div class="times"><span id="elapsed">0:00</span><span class="paused-chip">пауза</span><span id="remaining">−0:00</span></div>
        </div>
      </div>
    </section>

    <section id="lyrics">
      <header><span>Текст</span><span class="hint" id="hint"></span></header>
      <div class="viewport" id="viewport"><div class="lines" id="lines"></div></div>
    </section>
  </main>

  <section id="clock">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
  </section>

  <section id="notice">
    <div class="box">
      <div class="nt" id="ntTitle"></div>
      <div class="nb" id="ntBody"></div>
    </div>
  </section>

  <div class="chip" id="conn">Нет связи с сервером — переподключаюсь…</div>
  <div class="chip left" id="authchip"></div>

  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
